schema_version: "1.0"
template: photography
title: street-polaroid-memories

# 3-5 segments: first segment ~35-40s (full process), later segments ~17-23s
segments:
  # Segment 1: Full process (spot -> raise -> LCD reveal -> print -> walk -> hand over -> reaction)
  - clip_path: examples/photography/clips/segment_01.mp4
    in_point_sec: 0
    out_point_sec: 40
    still_photo_path: examples/photography/photos/photo_01.jpg
    reveal_time_sec: 8.5    # When camera LCD shows the photo
    walk_start_sec: 22      # Start of walk to subject
    walk_end_sec: 30        # Hand-over moment
    reaction_start_sec: 32  # Subject reaction begins

  # Segment 2: Condensed version (key moments only)
  - clip_path: examples/photography/clips/segment_02.mp4
    in_point_sec: 0
    out_point_sec: 20
    still_photo_path: examples/photography/photos/photo_02.jpg
    reveal_time_sec: 6
    walk_start_sec: 12
    walk_end_sec: 16
    reaction_start_sec: 17

  # Segment 3: Another condensed segment
  - clip_path: examples/photography/clips/segment_03.mp4
    in_point_sec: 2
    out_point_sec: 22
    still_photo_path: examples/photography/photos/photo_03.jpg
    reveal_time_sec: 7
    walk_start_sec: 13
    walk_end_sec: 17
    reaction_start_sec: 18

# Licensed background music
bgm_path: examples/photography/bgm/upbeat_acoustic.mp3
bgm_bpm: 120  # Optional: helps with beat detection fallback

# Optional subtitles (lyric subtitles or speech-only)
subtitle_path: examples/photography/subtitles/lyrics.srt
subtitle_type: lyric  # 'lyric' or 'speech'

# Optional source credit overlay
source_credit: "素材来源 @街头摄影师小王"
